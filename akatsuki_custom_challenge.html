<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akatsuki Custom Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: linear-gradient(135deg, rgba(255, 20, 20, 0.1) 0%, rgba(100, 0, 100, 0.1) 100%);
            border: 3px solid #ff1414;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 50px rgba(255, 20, 20, 0.3), inset 0 0 30px rgba(255, 20, 20, 0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #ff1414;
            text-shadow: 0 0 20px rgba(255, 20, 20, 0.8);
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        .subtitle {
            font-size: 20px;
            color: #e0e0e0;
            margin-top: 15px;
        }

        .prizes-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            border: 2px solid rgba(255, 20, 20, 0.5);
        }

        .prize-title {
            font-size: 24px;
            color: #ffeb3b;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .prize-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 20, 20, 0.1);
            border-radius: 8px;
            border-left: 4px solid #ff1414;
            transition: all 0.3s ease;
        }

        .prize-row:hover {
            background: rgba(255, 20, 20, 0.2);
            transform: translateX(10px);
        }

        .position {
            font-size: 32px;
            font-weight: bold;
            color: #ff1414;
            min-width: 60px;
        }

        .prize-amount {
            font-size: 28px;
            color: #ffeb3b;
            font-weight: bold;
        }

        .medal {
            font-size: 40px;
            margin: 0 10px;
        }

        .cta-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 20, 20, 0.15);
            border-radius: 10px;
            border: 2px dashed #ff1414;
        }

        .cta-text {
            font-size: 18px;
            color: #e0e0e0;
            margin: 10px 0;
        }

        .booyah {
            font-size: 36px;
            font-weight: bold;
            color: #ff1414;
            text-shadow: 0 0 15px rgba(255, 20, 20, 0.8);
            margin-top: 15px;
            animation: bounce 1s infinite;
        }

        .trophy {
            font-size: 60px;
            margin: 15px 0;
            animation: spin 3s infinite linear;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 20, 20, 0.8);
            }
            50% {
                opacity: 0.8;
                text-shadow: 0 0 40px rgba(255, 20, 20, 1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes spin {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        .footer {
            margin-top: 20px;
            font-size: 16px;
            color: #b0b0b0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }
            .title {
                font-size: 36px;
            }
            .prize-row {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">☁️ AKATSUKI CUSTOM</div>
            <div class="subtitle">💌 CHALLENGE 💌</div>
        </div>

        <div class="prizes-section">
            <div class="prize-title">🎯 PRIZE POOL</div>

            <div class="prize-row">
                <span class="medal">🥇</span>
                <span class="position">TOP 1</span>
                <span class="prize-amount">20 RS</span>
            </div>

            <div class="prize-row">
                <span class="medal">🥈</span>
                <span class="position">TOP 2</span>
                <span class="prize-amount">15 RS</span>
            </div>

            <div class="prize-row">
                <span class="medal">🥉</span>
                <span class="position">TOP 3</span>
                <span class="prize-amount">10 RS</span>
            </div>
        </div>

        <div class="cta-section">
            <div class="trophy">🏆</div>
            <div class="cta-text">Custom Booyah Winner!</div>
            <div class="booyah">BOOYAH! 🎮</div>
            <div class="cta-text" style="margin-top: 15px; font-weight: bold; font-size: 20px;">
                Are You Ready to DOMINATE?
            </div>
        </div>

        <div class="footer">
            Show your skills • Claim your prize • Become a legend
        </div>
    </div>
</body>
</html>
