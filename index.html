<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Player Card - Elite Viewer Edition</title>
<!-- html2pdf Library for PDF Download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- FontAwesome for Gaming Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #07080c;
    --card-bg: radial-gradient(circle at 0% 0%, #1c1d2d 0%, #0d0e17 75%, #080910 100%);
    --accent-gold: #ffb400;
    --accent-gold-glow: rgba(255, 180, 0, 0.4);
    --accent-red: #ff2a2a;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(255, 180, 0, 0.25);
  }

  * {
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  
  body {
    background: var(--bg-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 8px; /* Required 8px outer padding for screen container */
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(255, 42, 42, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255, 180, 0, 0.08) 0%, transparent 45%);
  }
  
  /* Gaming Card Styling */
  .card {
    width: 100%;
    max-width: 680px;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 16px; /* Inner card padding */
    box-shadow: 
      0 15px 35px -5px rgba(0, 0, 0, 0.8),
      0 0 30px rgba(255, 180, 0, 0.15),
      inset 0 0 2px rgba(255, 255, 255, 0.15);
    border: 2px solid var(--accent-gold);
    position: relative;
    color: var(--text-main);
    overflow: hidden;
  }

  /* Decorative Red Akatsuki Glow Background Effect */
  .card::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, rgba(255, 42, 42, 0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Top Bar Header for All Players Button */
  .top-bar {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 12px;
  }
  .all-players-btn {
    background: rgba(255, 180, 0, 0.12);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(255, 180, 0, 0.15);
  }
  .all-players-btn:hover {
    background: var(--accent-gold);
    color: #000;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--accent-gold-glow);
  }

  /* Header Section - Fixed Overflow & Cut issue */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(255, 180, 0, 0.2);
    padding-bottom: 12px;
    margin-bottom: 20px;
    gap: 8px;
    flex-wrap: wrap; /* Prevents right badge from cutting out */
  }
  .flag-box {
    width: 50px;
    height: 22px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #128807 66.6%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .chakra {
    width: 7px;
    height: 7px;
    border: 1px solid #000080;
    border-radius: 50%;
  }
  .title {
    font-family: 'Teko', sans-serif;
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 180, 0, 0.4);
    white-space: nowrap;
    line-height: 1;
    flex-shrink: 1;
  }
  .sub-logo {
    font-size: clamp(10px, 2.5vw, 12px);
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.05);
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .content {
    display: flex;
    gap: 16px;
  }

  .avatar-container {
    width: 170px;
    aspect-ratio: 3 / 4;
    height: auto;
    background: #10111a;
    border-radius: 14px;
    border: 2px solid var(--accent-gold);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0,0,0,0.8);
    transition: transform 0.3s ease;
  }
  .avatar-container:hover {
    transform: scale(1.02);
  }
  .avatar-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .details {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    gap: 8px;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 6px;
    gap: 8px;
  }
  .field-row > div:first-child {
    flex: 1;
    min-width: 0;
  }
  .label {
    font-size: 10px;
    font-weight: 800;
    color: var(--accent-gold);
    letter-spacing: 0.8px;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .input-box {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 180, 0, 0.25);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: clamp(12px, 3vw, 14px);
    font-weight: 700;
    color: #ffffff;
    outline: none;
    width: 100%;
    transition: all 0.3s ease;
  }
  .input-box:disabled {
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .input-box:focus:not(:disabled) {
    border-color: var(--accent-gold);
    background: rgba(255, 180, 0, 0.08);
    box-shadow: 0 0 12px rgba(255, 180, 0, 0.25);
  }
  .icon-badge {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    color: var(--accent-gold);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 16px;
    border-top: 2px solid rgba(255, 180, 0, 0.2);
    padding-top: 12px;
    gap: 8px;
  }
  .footer-text {
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 900;
    color: #e2e8f0;
    letter-spacing: 1px;
  }
  .footer-text span {
    color: var(--accent-gold);
  }
  .barcode-box {
    text-align: right;
    flex-shrink: 0;
  }
  .barcode {
    background: #ffffff;
    color: #000000;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: monospace;
    font-size: clamp(11px, 3vw, 14px);
    font-weight: bold;
    letter-spacing: 2px;
    display: inline-block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .barcode-id {
    font-size: 10px;
    font-weight: 800;
    color: var(--accent-gold);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .btn-container {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 100px;
    padding: 10px 12px;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .fetch-btn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
  }
  .pdf-btn {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
  }
  .clear-btn {
    background: linear-gradient(135deg, #475569, #334155);
    box-shadow: 0 4px 15px rgba(71, 85, 105, 0.35);
  }
  .action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
  }

  .card-footer {
    text-align: center;
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card-footer p {
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
  }

  /* ===== Glassmorphism Modal Styling (Player List) ===== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 12px;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-box {
    background: #12131d;
    border: 2px solid var(--accent-gold);
    border-radius: 16px;
    width: 100%;
    max-width: 460px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 35px rgba(255, 180, 0, 0.25);
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 16px;
    background: rgba(255, 180, 0, 0.08);
    border-bottom: 1px solid rgba(255, 180, 0, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    color: var(--accent-gold);
    font-size: 15px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .close-btn {
    background: rgba(255, 42, 42, 0.15);
    border: 1px solid rgba(255, 42, 42, 0.3);
    color: var(--accent-red);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover {
    background: var(--accent-red);
    color: #fff;
  }
  
  /* Modal Search Bar */
  .modal-search-box {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(0, 0, 0, 0.2);
  }
  .modal-search-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-weight: 600;
    outline: none;
    font-size: 13px;
    transition: all 0.3s ease;
  }
  .modal-search-input:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 10px rgba(255, 180, 0, 0.25);
    background: rgba(255, 180, 0, 0.05);
  }

  .player-list {
    padding: 12px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .player-item:hover {
    background: rgba(255, 180, 0, 0.12);
    border-color: var(--accent-gold);
    transform: translateX(3px);
  }
  .p-name {
    font-weight: 700;
    color: #fff;
    font-size: 13px;
  }
  .p-uid {
    font-size: 11px;
    color: var(--accent-gold);
    font-weight: 700;
    background: rgba(255, 180, 0, 0.1);
    padding: 3px 6px;
    border-radius: 5px;
  }

  /* Extreme Mobile Optimization */
  @media (max-width: 480px) {
    body {
      padding: 8px; /* Strict 8px container padding */
    }
    .card {
      padding: 14px;
    }
    .header {
      gap: 6px;
    }
    .sub-logo {
      padding: 4px 8px;
      font-size: 10px;
    }
    .content {
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .avatar-container {
      width: 150px;
    }
    .details {
      width: 100%;
    }
    .footer {
      flex-direction: row;
      align-items: center;
      text-align: left;
    }
    .barcode-box {
      text-align: right;
    }
    .btn-container {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="card" id="playerCardContainer">
  <!-- Top Bar for All Players Option -->
  <div class="top-bar" data-html2pdf-ignore="true">
    <button type="button" class="all-players-btn" onclick="openPlayerList()">
      <i class="fa-solid fa-users"></i> ALL PLAYERS
    </button>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="flag-box">
      <div class="chakra"></div>
    </div>
    <div class="title">FREE FIRE</div>
    <div class="sub-logo">⚡ FF IDENTITY</div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="avatar-container">
      <img src="https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555" alt="Primis Character" id="player-avatar">
    </div>

    <!-- Fields -->
    <div class="details">
      <div class="field-row">
        <div>
          <div class="label">PLAYER NAME:</div>
          <input type="text" class="input-box" id="input-name" value="" placeholder="Search by UID..." disabled>
        </div>
        <div class="icon-badge"><i class="fa-solid fa-trophy"></i></div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">UID (ENTER TO SEARCH):</div>
          <input type="text" class="input-box" id="input-uid" value="" placeholder="Enter UID here" oninput="updateBarcode(this.value)">
        </div>
        <div class="icon-badge"><i class="fa-solid fa-shield-halved"></i></div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">GUILD NAME:</div>
          <input type="text" class="input-box" id="input-guild" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge"><i class="fa-solid fa-crosshairs"></i></div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">REGION:</div>
          <input type="text" class="input-box" id="input-region" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge"><i class="fa-solid fa-globe"></i></div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">LEVEL:</div>
          <input type="text" class="input-box" id="input-level" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge"><i class="fa-solid fa-star"></i></div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">ELITE PASS:</div>
          <input type="text" class="input-box" id="input-pass" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge"><i class="fa-solid fa-crown"></i></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">
      MY <span>FREE FIRE</span> IDENTITY
    </div>
<br>
    <div class="barcode-box">
      <div class="barcode">|||| ||| ||||| |||</div>
      <div class="barcode-id" id="barcode-text">FFID-</div>
    </div>
  </div>

  <!-- Action Buttons Container -->
  <div class="btn-container" data-html2pdf-ignore="true">
    <button type="button" class="action-btn fetch-btn" onclick="fetchFromDatabase()">
      <i class="fa-solid fa-download"></i> FETCH DATA
    </button>
    <button type="button" class="action-btn pdf-btn" onclick="downloadCardPDF()">
      <i class="fa-solid fa-file-pdf"></i> DOWNLOAD PDF
    </button>
    <button type="button" class="action-btn clear-btn" onclick="clearCardForm()">
      <i class="fa-solid fa-rotate-right"></i> CLEAR
    </button>
  </div>

  <!-- Footer Section -->
  <footer class="card-footer">
    <p>© Copyright &amp; Created by Zahid</p>
  </footer>
</div>

<!-- All Players Modal with Search Bar -->
<div class="modal-overlay" id="playerModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3><i class="fa-solid fa-users-viewfinder"></i> ALL PLAYERS LIST</h3>
      <button class="close-btn" onclick="closePlayerList()">✕</button>
    </div>
    
    <!-- Search Bar Inside Modal -->
    <div class="modal-search-box">
      <input type="text" class="modal-search-input" id="modalSearchInput" placeholder="🔍 Search by Name or UID..." onkeyup="filterPlayerList()">
    </div>

    <div class="player-list" id="modal-player-list">
      <p style="text-align: center; color: var(--text-muted);">Loading players...</p>
    </div>
  </div>
</div>

<script>
  let allPlayersData = []; 

  function updateBarcode(val) {
    document.getElementById('barcode-text').innerText = 'FFID-' + val;
  }

  function populateCard(player) {
    document.getElementById('input-uid').value = player.uid || '';
    document.getElementById('input-name').value = player.playerName || 'N/A';
    document.getElementById('input-guild').value = player.guildName || 'N/A';
    document.getElementById('input-region').value = player.region || 'N/A';
    document.getElementById('input-level').value = player.level || 'N/A';
    document.getElementById('input-pass').value = player.elitePass || 'N/A';

    if (player.avatarUrl) {
      document.getElementById('player-avatar').src = player.avatarUrl;
    } else {
      document.getElementById('player-avatar').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
    }

    updateBarcode(player.uid || '');
  }

  async function fetchFromDatabase() {
    const uidInput = document.getElementById('input-uid').value.trim();

    if (!uidInput) {
      alert('Kripya pehle UID field me ID enter karein!');
      return;
    }

    const API_URL = `https://ff-player-card.onrender.com/api/player/${uidInput}`;

    try {
      const response = await fetch(API_URL, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      
      const result = await response.json();

      if (result.success) {
        populateCard(result.data);
        alert('Player Data Successfully Load Ho Gaya!');
      } else {
        alert('Is UID ka koi data database me nahi mila!');
      }
    } catch (error) {
      console.error('FETCH ERROR:', error);
      alert('Backend se connect karne me error aaya!');
    }
  }

  // ADVANCED PDF DOWNLOAD FUNCTION

  async function downloadCardPDF() {
    const cardElement = document.getElementById('playerCardContainer');
    const playerName = document.querySelectorAll('.input-box')[0].value || 'Player';

    // A4 wrapper with White Background (#ffffff)
    const wrapper = document.createElement('div');
    wrapper.style.width = '210mm';
    wrapper.style.height = '295mm';
    wrapper.style.display = 'flex';
    wrapper.style.justifyContent = 'center';
    wrapper.style.alignItems = 'center';
    wrapper.style.backgroundColor = '#ffffff';
    wrapper.style.boxSizing = 'border-box';
    wrapper.style.overflow = 'hidden';

    // Cloned card container
    const clonedCard = cardElement.cloneNode(true);
    clonedCard.style.width = '530px'; 
    clonedCard.style.maxWidth = '100%';
    clonedCard.style.padding = '32px';
    clonedCard.style.margin = '0 auto';
    clonedCard.style.transform = 'scale(0.85)';
    clonedCard.style.transformOrigin = 'center center';
    clonedCard.style.position = 'relative';

    // 1. Akatsuki Watermark Text Background
    const watermarkText = document.createElement('div');
    watermarkText.innerText = 'AKATSUKI';
    watermarkText.style.position = 'absolute';
    watermarkText.style.top = '48%';
    watermarkText.style.left = '50%';
    watermarkText.style.transform = 'translate(-50%, -50%) rotate(-20deg)';
    watermarkText.style.fontSize = '72px';
    watermarkText.style.fontWeight = '900';
    watermarkText.style.color = '#ff0000';
    watermarkText.style.opacity = '0.08';
    watermarkText.style.letterSpacing = '6px';
    watermarkText.style.pointerEvents = 'none';
    watermarkText.style.zIndex = '0';
    watermarkText.style.whiteSpace = 'nowrap';
    clonedCard.appendChild(watermarkText);

    // 2. Emoji Cloud with Native Red Radial Glow
    const createCloudEmojiWithGlow = (position) => {
      const container = document.createElement('div');
      container.style.position = 'absolute';
      container.style.top = '165px';
      container.style.width = '60px';
      container.style.height = '60px';
      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      container.style.zIndex = '99999';

      if (position === 'left') {
        container.style.left = '55px';
      } else {
        container.style.right = '55px';
      }

      const redGlow = document.createElement('div');
      redGlow.style.position = 'absolute';
      redGlow.style.width = '55px';
      redGlow.style.height = '55px';
      redGlow.style.borderRadius = '50%';
      redGlow.style.background = 'radial-gradient(circle, rgba(255, 0, 0, 0.95) 0%, rgba(231, 76, 60, 0.6) 45%, rgba(255, 0, 0, 0) 75%)';
      redGlow.style.zIndex = '1';

      const emojiText = document.createElement('span');
      emojiText.innerText = '☁️';
      emojiText.style.fontSize = '40px';
      emojiText.style.position = 'relative';
      emojiText.style.zIndex = '2';
      emojiText.style.lineHeight = '1';

      container.appendChild(redGlow);
      container.appendChild(emojiText);

      return container;
    };

    clonedCard.appendChild(createCloudEmojiWithGlow('left'));
    clonedCard.appendChild(createCloudEmojiWithGlow('right'));

    // Dynamic Spacing adjustments & Input Fields Customization
    const contentBox = clonedCard.querySelector('.content');
    if (contentBox) contentBox.style.gap = '24px';

    const detailsBox = clonedCard.querySelectorAll('.field-row');
    detailsBox.forEach(row => {
      row.style.paddingBottom = '10px';
      row.style.marginBottom = '6px';
      row.style.width = '75%';
      row.style.marginLeft = 'auto';
      row.style.marginRight = 'auto';
      row.style.position = 'relative'; 
      row.style.zIndex = '2';
    });

    // 3. Footer me "Created by Zahid" Text
    let footerBox = clonedCard.querySelector('.footer');
    if (!footerBox) {
      footerBox = document.createElement('div');
      footerBox.className = 'footer';
      clonedCard.appendChild(footerBox);
    }
    footerBox.style.marginTop = '24px';
    footerBox.style.paddingTop = '18px';
    footerBox.style.textAlign = 'center';
    footerBox.style.fontSize = '12px';
    footerBox.style.color = '#888888';
    footerBox.style.position = 'relative';
    footerBox.style.zIndex = '2';
    
    footerBox.innerHTML += '<div style="margin-top: 8px; font-weight: bold; color: #f39c12; letter-spacing: 0.5px;">Official Akatsuki Group</div>';

    const elementsToRemove = clonedCard.querySelectorAll('[data-html2pdf-ignore="true"]');
    elementsToRemove.forEach(el => el.remove());

    wrapper.appendChild(clonedCard);
    document.body.appendChild(wrapper);

    const options = {
      margin:       0,
      filename:     `FreeFire_Card_${playerName}.pdf`,
      image:        { type: 'jpeg', quality: 1.0 },
      html2canvas:  { scale: 3, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['avoid-all'] }
    };

    html2pdf().from(wrapper).set(options).save().then(() => {
      document.body.removeChild(wrapper);
    });
  }


  async function openPlayerList() {
    document.getElementById('playerModal').classList.add('active');
    document.getElementById('modalSearchInput').value = '';
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Loading players...</p>';

    const API_URL = `https://ff-player-card.onrender.com/api/players`;

    try {
      const response = await fetch(API_URL);
      
      if (!response.ok) {
        throw new Error(`Server Status: ${response.status}`);
      }
      
      const result = await response.json();

      if (result.success && result.data && result.data.length > 0) {
        allPlayersData = result.data; 
        renderPlayerList(allPlayersData);
      } else {
        listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Database me koi player nahi mila!</p>';
      }
    } catch (error) {
      console.error('FETCH PLAYERS ERROR:', error);
      listContainer.innerHTML = `<p style="text-align: center; color: var(--accent-red);">Failed to load player list!<br><small>(${error.message})</small></p>`;
    }
  }

  function renderPlayerList(players) {
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '';

    if (players.length === 0) {
      listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Koi matching player nahi mila!</p>';
      return;
    }

    players.forEach(player => {
      const item = document.createElement('div');
      item.className = 'player-item';
      item.innerHTML = `
        <span class="p-name">${player.playerName || 'Unknown'}</span>
        <span class="p-uid">UID: ${player.uid}</span>
      `;
      item.onclick = () => {
        populateCard(player);
        closePlayerList();
      };
      listContainer.appendChild(item);
    });
  }

  function filterPlayerList() {
    const query = document.getElementById('modalSearchInput').value.toLowerCase().trim();
    
    const filtered = allPlayersData.filter(player => {
      const name = (player.playerName || '').toLowerCase();
      const uid = (player.uid || '').toString();
      return name.includes(query) || uid.includes(query);
    });

    renderPlayerList(filtered);
  }

  function closePlayerList() {
    document.getElementById('playerModal').classList.remove('active');
  }

  function clearCardForm() {
    document.getElementById('input-uid').value = '';
    document.getElementById('input-name').value = '';
    document.getElementById('input-guild').value = '';
    document.getElementById('input-region').value = '';
    document.getElementById('input-level').value = '';
    document.getElementById('input-pass').value = '';
    
    document.getElementById('player-avatar').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
    document.getElementById('barcode-text').innerText = 'FFID-';
  }
</script>
