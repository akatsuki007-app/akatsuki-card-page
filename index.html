<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Player Card - Viewer Edition</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, sans-serif;
  }
  body {
    background: #08080a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  
  /* Gaming Card Styling */
  .card {
    width: 100%;
    max-width: 650px;
    background: radial-gradient(circle at top left, #1f1f2e 0%, #0d0d14 100%);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 0 25px rgba(255, 180, 0, 0.15), inset 0 0 2px rgba(255, 255, 255, 0.2);
    border: 2px solid #ffb400;
    position: relative;
    color: #ffffff;
  }

  /* Top Bar Header for All Players Button */
  .top-bar {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 12px;
  }
  .all-players-btn {
    background: rgba(255, 180, 0, 0.15);
    border: 1px solid #ffb400;
    color: #ffb400;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 10px rgba(255, 180, 0, 0.2);
  }
  .all-players-btn:hover {
    background: #ffb400;
    color: #000;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(255, 180, 0, 0.3);
    padding-bottom: 12px;
    margin-bottom: 20px;
    gap: 10px;
  }
  .flag-box {
    width: 70px;
    height: 22px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #128807 66.6%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .chakra {
    width: 7px;
    height: 7px;
    border: 1px solid #000080;
    border-radius: 50%;
  }
  .title {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    color: #ffb400;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 180, 0, 0.5);
    white-space: nowrap;
  }
  .sub-logo {
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 800;
    color: #94a3b8;
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .content {
    display: flex;
    gap: 20px;
  }

  .avatar-container {
    width: 200px;
    aspect-ratio: 3 / 4;
    height: auto;
    background: #14141f;
    border-radius: 14px;
    border: 2px solid #ffb400;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
  }
  .avatar-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .details {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 6px;
    gap: 8px;
  }
  .field-row > div:first-child {
    flex: 1;
    min-width: 0;
  }
  .label {
    font-size: clamp(10px, 2.5vw, 12px);
    font-weight: 800;
    color: #ffb400;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .input-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 180, 0, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: clamp(13px, 3.2vw, 15px);
    font-weight: 700;
    color: #ffffff;
    outline: none;
    width: 100%;
    transition: all 0.3s ease;
  }
  .input-box:disabled {
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: not-allowed;
  }
  .input-box:focus:not(:disabled) {
    border-color: #ffb400;
    background: rgba(255, 180, 0, 0.1);
    box-shadow: 0 0 8px rgba(255, 180, 0, 0.3);
  }
  .icon-badge {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 20px;
    border-top: 2px solid rgba(255, 180, 0, 0.3);
    padding-top: 14px;
    gap: 10px;
  }
  .footer-text {
    font-size: clamp(12px, 3.5vw, 16px);
    font-weight: 900;
    color: #e2e8f0;
    letter-spacing: 1px;
  }
  .footer-text span {
    color: #ffb400;
  }
  .barcode-box {
    text-align: right;
    flex-shrink: 0;
  }
  .barcode {
    background: #ffffff;
    color: #000000;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: monospace;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: bold;
    letter-spacing: 2px;
    display: inline-block;
  }
  .barcode-id {
    font-size: 11px;
    font-weight: 800;
    color: #ffb400;
    margin-top: 4px;
  }

  .btn-container {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .action-btn {
    flex: 1;
    padding: 12px;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .fetch-btn {
    background: #2563eb;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
  }
  .clear-btn {
    background: #475569;
    box-shadow: 0 4px 12px rgba(71, 85, 105, 0.4);
  }
  .clear-btn:hover {
    background: #334155;
  }
  .action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }

  .card-footer {
    text-align: center;
    padding: 15px 0;
    margin-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .card-footer p {
    color: #a0a0a0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin: 0;
    font-family: 'Poppins', sans-serif;
  }

  /* ===== Modal Styling (Player List) ===== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 15px;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-box {
    background: #14141f;
    border: 2px solid #ffb400;
    border-radius: 16px;
    width: 100%;
    max-width: 450px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(255, 180, 0, 0.3);
    overflow: hidden;
  }
  .modal-header {
    padding: 15px;
    background: rgba(255, 180, 0, 0.1);
    border-bottom: 1px solid rgba(255, 180, 0, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    color: #ffb400;
    font-size: 18px;
    font-weight: 800;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #ff5050;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
  }
  
  /* Modal Search Bar */
  .modal-search-box {
    padding: 12px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .modal-search-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid #ffb400;
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-weight: 600;
    outline: none;
    font-size: 14px;
  }
  .modal-search-input:focus {
    box-shadow: 0 0 8px rgba(255, 180, 0, 0.4);
  }

  .player-list {
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .player-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .player-item:hover {
    background: rgba(255, 180, 0, 0.15);
    border-color: #ffb400;
  }
  .p-name {
    font-weight: 700;
    color: #fff;
    font-size: 15px;
  }
  .p-uid {
    font-size: 12px;
    color: #ffb400;
    font-weight: 600;
  }

  @media (max-width: 520px) {
    .card {
      padding: 16px;
    }
    .content {
      flex-direction: column;
      align-items: center;
    }
    .avatar-container {
      width: 160px;
    }
    .details {
      width: 100%;
      gap: 10px;
    }
    .footer {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }
    .barcode-box {
      text-align: center;
    }
    .btn-container {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="card">
  <!-- Top Bar for All Players Option -->
  <div class="top-bar">
    <button type="button" class="all-players-btn" onclick="openPlayerList()">👥 ALL PLAYERS</button>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="flag-box">
      <div class="chakra"></div>
    </div>
    <div class="title">FREE FIRE</div>
    <div class="sub-logo">⚡ FF IDENTITY</div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="avatar-container">
      <img src="https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555" alt="Primis Character" id="player-avatar">
    </div>

    <!-- Fields -->
    <div class="details">
      <div class="field-row">
        <div>
          <div class="label">PLAYER NAME:</div>
          <input type="text" class="input-box" id="input-name" value="" placeholder="Search by UID..." disabled>
        </div>
        <div class="icon-badge">🏆</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">UID (ENTER TO SEARCH):</div>
          <input type="text" class="input-box" id="input-uid" value="" placeholder="Enter UID here" oninput="updateBarcode(this.value)">
        </div>
        <div class="icon-badge">🛡️</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">REGION:</div>
          <input type="text" class="input-box" id="input-region" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge">🇮🇳</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">LEVEL:</div>
          <input type="text" class="input-box" id="input-level" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge">⭐</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">ELITE PASS:</div>
          <input type="text" class="input-box" id="input-pass" value="" placeholder="---" disabled>
        </div>
        <div class="icon-badge">👑</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">
      MY <span>FREE FIRE</span> IDENTITY
    </div>
    <div class="barcode-box">
      <div class="barcode">|||| ||| ||||| |||</div>
      <div class="barcode-id" id="barcode-text">FFID-</div>
    </div>
  </div>

  <!-- Action Buttons Container -->
  <div class="btn-container">
    <button type="button" class="action-btn fetch-btn" onclick="fetchFromDatabase()">FETCH DATA</button>
    <button type="button" class="action-btn clear-btn" onclick="clearCardForm()">CLEAR</button>
  </div>

  <!-- Footer Section -->
  <footer class="card-footer">
    <p>© Copyright by Zahid &amp; Created by Zahid</p>
  </footer>
</div>

<!-- All Players Modal with Search Bar -->
<div class="modal-overlay" id="playerModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>👥 ALL PLAYERS LIST</h3>
      <button class="close-btn" onclick="closePlayerList()">✕</button>
    </div>
    
    <!-- Search Bar Inside Modal -->
    <div class="modal-search-box">
      <input type="text" class="modal-search-input" id="modalSearchInput" placeholder="🔍 Search by Name or UID..." onkeyup="filterPlayerList()">
    </div>

    <div class="player-list" id="modal-player-list">
      <p style="text-align: center; color: #a0a0a0;">Loading players...</p>
    </div>
  </div>
</div>

<script>
  let allPlayersData = []; // Store players list globally for instant searching

  function updateBarcode(val) {
    document.getElementById('barcode-text').innerText = 'FFID-' + val;
  }

  function populateCard(player) {
    document.getElementById('input-uid').value = player.uid || '';
    document.getElementById('input-name').value = player.playerName || 'N/A';
    document.getElementById('input-region').value = player.region || 'N/A';
    document.getElementById('input-level').value = player.level || 'N/A';
    document.getElementById('input-pass').value = player.elitePass || 'N/A';

    if (player.avatarUrl) {
      document.getElementById('player-avatar').src = player.avatarUrl;
    } else {
      document.getElementById('player-avatar').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
    }

    updateBarcode(player.uid || '');
  }

  async function fetchFromDatabase() {
    const uidInput = document.getElementById('input-uid').value.trim();

    if (!uidInput) {
      alert('Kripya pehle UID field me ID enter karein!');
      return;
    }

    const API_URL = `https://ff-player-card.onrender.com/api/player/${uidInput}`;

    try {
      const response = await fetch(API_URL, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      
      const result = await response.json();

      if (result.success) {
        populateCard(result.data);
        alert('Player Data Successfully Load Ho Gaya!');
      } else {
        alert('Is UID ka koi data database me nahi mila!');
      }
    } catch (error) {
      console.error('FETCH ERROR:', error);
      alert('Backend se connect karne me error aaya!');
    }
  }

  async function openPlayerList() {
    document.getElementById('playerModal').classList.add('active');
    document.getElementById('modalSearchInput').value = '';
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '<p style="text-align: center; color: #a0a0a0;">Loading players...</p>';

    const API_URL = `https://ff-player-card.onrender.com/api/players`;

    try {
      const response = await fetch(API_URL);
      
      if (!response.ok) {
        throw new Error(`Server Status: ${response.status}`);
      }
      
      const result = await response.json();

      if (result.success && result.data && result.data.length > 0) {
        allPlayersData = result.data; // Save data locally
        renderPlayerList(allPlayersData);
      } else {
        listContainer.innerHTML = '<p style="text-align: center; color: #a0a0a0;">Database me koi player nahi mila!</p>';
      }
    } catch (error) {
      console.error('FETCH PLAYERS ERROR:', error);
      listContainer.innerHTML = `<p style="text-align: center; color: #ff5050;">Failed to load player list!<br><small>(${error.message})</small></p>`;
    }
  }

  function renderPlayerList(players) {
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '';

    if (players.length === 0) {
      listContainer.innerHTML = '<p style="text-align: center; color: #a0a0a0;">Koi matching player nahi mila!</p>';
      return;
    }

    players.forEach(player => {
      const item = document.createElement('div');
      item.className = 'player-item';
      item.innerHTML = `
        <span class="p-name">${player.playerName || 'Unknown'}</span>
        <span class="p-uid">UID: ${player.uid}</span>
      `;
      item.onclick = () => {
        populateCard(player);
        closePlayerList();
      };
      listContainer.appendChild(item);
    });
  }

  function filterPlayerList() {
    const query = document.getElementById('modalSearchInput').value.toLowerCase().trim();
    
    const filtered = allPlayersData.filter(player => {
      const name = (player.playerName || '').toLowerCase();
      const uid = (player.uid || '').toString();
      return name.includes(query) || uid.includes(query);
    });

    renderPlayerList(filtered);
  }

  function closePlayerList() {
    document.getElementById('playerModal').classList.remove('active');
  }

  function clearCardForm() {
    document.getElementById('input-uid').value = '';
    document.getElementById('input-name').value = '';
    document.getElementById('input-region').value = '';
    document.getElementById('input-level').value = '';
    document.getElementById('input-pass').value = '';
    
    document.getElementById('player-avatar').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
    document.getElementById('barcode-text').innerText = 'FFID-';
  }
</script>

</body>
</html>
