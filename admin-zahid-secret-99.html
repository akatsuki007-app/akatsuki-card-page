<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Player Card - Elite Cyber Edition</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- html2pdf Library for PDF Download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Rajdhani', sans-serif;
  }
  body {
    background: radial-gradient(circle at center, #12131c 0%, #050508 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  
  /* Cyber Gaming Card Styling */
  .card {
    width: 100%;
    max-width: 550px;
    background: linear-gradient(135deg, #0d0f1a 0%, #07080f 100%);
    border-radius: 24px;
    padding: 26px;
    box-shadow: 0 0 40px rgba(0, 242, 254, 0.15), 0 0 20px rgba(255, 0, 85, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.03);
    border: 2px solid transparent;
    border-image: linear-gradient(to bottom right, #00f2fe, #ff0055) 1;
    position: relative;
    color: #ffffff;
    margin: 0 auto;
  }

  /* Top Bar Header for All Players Button */
  .top-bar {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 14px;
  }
  .all-players-btn {
    background: rgba(0, 242, 254, 0.1);
    border: 1px solid #00f2fe;
    color: #00f2fe;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
    letter-spacing: 1px;
  }
  .all-players-btn:hover {
    background: #00f2fe;
    color: #050508;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 14px;
    margin-bottom: 20px;
    gap: 10px;
  }
  .flag-box {
    width: 74px;
    height: 24px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #128807 66.6%);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(255, 153, 51, 0.4);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .chakra {
    width: 8px;
    height: 8px;
    border: 1px solid #000080;
    border-radius: 50%;
    background: #000080;
  }
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 4.5vw, 28px);
    font-weight: 900;
    background: linear-gradient(90deg, #00f2fe, #ff0055);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4));
    white-space: nowrap;
  }
  .sub-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px, 2.5vw, 12px);
    font-weight: 700;
    color: #00f2fe;
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .content {
    display: flex;
    gap: 20px;
  }

  .avatar-container {
    width: 175px;
    aspect-ratio: 3 / 4;
    height: auto;
    background: #0a0c14;
    border-radius: 14px;
    border: 2px solid #00f2fe;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
  }
  .avatar-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .avatar-hint {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.85);
    padding: 6px 0;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
    border-top: 1px solid rgba(0, 242, 254, 0.3);
  }
  #avatar-input {
    display: none;
  }

  .details {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 6px;
    gap: 8px;
  }
  .field-row > div:first-child {
    flex: 1;
    min-width: 0;
  }
  .label {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(9px, 2.2vw, 11px);
    font-weight: 700;
    color: #00f2fe;
    letter-spacing: 1.5px;
    margin-bottom: 2px;
  }
  .input-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(0, 242, 254, 0.25);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: clamp(13px, 3vw, 15px);
    font-weight: 700;
    color: #ffffff;
    outline: none;
    width: 100%;
    transition: all 0.3s ease;
  }
  .input-box:focus {
    border-color: #ff0055;
    background: rgba(255, 0, 85, 0.08);
    box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
  }
  .icon-badge {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.05);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 20px;
    border-top: 2px solid rgba(255, 255, 255, 0.08);
    padding-top: 14px;
    gap: 10px;
  }
  .footer-text {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 900;
    color: #e2e8f0;
    letter-spacing: 1.5px;
  }
  .footer-text span {
    color: #ff0055;
    text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
  }
  .barcode-box {
    text-align: right;
    flex-shrink: 0;
  }
  .barcode {
    background: #ffffff;
    color: #000000;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: monospace;
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: bold;
    letter-spacing: 2px;
    display: inline-block;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }
  .barcode-id {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #00f2fe;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* Action Buttons Containers */
  .btn-container {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .action-btn {
    flex: 1;
    padding: 12px;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }
  .fetch-btn {
    background: linear-gradient(135deg, #0072ff, #00f2fe);
    box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    border: 1px solid rgba(0, 242, 254, 0.4);
  }
  .save-btn {
    background: linear-gradient(135deg, #ff0055, #ff5e62);
    box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
    border: 1px solid rgba(255, 94, 98, 0.4);
  }
  .clear-btn {
    background: linear-gradient(135deg, #2c3e50, #4ca1af);
    box-shadow: 0 4px 15px rgba(76, 161, 175, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .pdf-btn {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
    margin-top: 12px;
    width: 100%;
    border: 1px solid rgba(56, 239, 125, 0.4);
  }

  .action-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.15);
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
  }

  .card-footer {
    text-align: center;
    padding: 16px 0 0 0;
    margin-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card-footer p {
    color: #8a8d9b;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    margin: 0;
    font-family: 'Orbitron', sans-serif;
  }

  /* Modal Styling */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 5, 8, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 15px;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-box {
    background: #0d0f1a;
    border: 2px solid #00f2fe;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px;
    background: rgba(0, 242, 254, 0.08);
    border-bottom: 1px solid rgba(0, 242, 254, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    color: #00f2fe;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #ff0055;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .close-btn:hover {
    transform: scale(1.2);
  }
  
  .modal-search-box {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .modal-search-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #00f2fe;
    border-radius: 10px;
    padding: 10px 14px;
    color: #fff;
    font-weight: 600;
    outline: none;
    font-size: 14px;
    transition: all 0.3s;
  }
  .modal-search-input:focus {
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    background: rgba(0, 242, 254, 0.05);
  }

  .player-list {
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .player-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .player-item:hover {
    background: rgba(0, 242, 254, 0.1);
    border-color: #00f2fe;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
  }
  .p-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }
  .p-name {
    font-weight: 700;
    color: #fff;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .p-uid {
    font-size: 12px;
    color: #00f2fe;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
  }

  /* Delete Button Styling */
  .delete-btn {
    background: rgba(255, 0, 85, 0.1);
    border: 1px solid #ff0055;
    color: #ff0055;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover {
    background: #ff0055;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
  }

  @media (max-width: 520px) {
    .card {
      padding: 16px;
    }
    .content {
      flex-direction: column;
      align-items: center;
    }
    .avatar-container {
      width: 160px;
    }
    .details {
      width: 100%;
      gap: 10px;
    }
    .footer {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }
    .barcode-box {
      text-align: center;
    }
    .btn-container {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="card" id="playerCardContainer">
  <div class="top-bar" data-html2pdf-ignore="true">
    <button type="button" class="all-players-btn" onclick="openPlayerList()">👥 ALL PLAYERS</button>
  </div>

  <div class="header">
    <div class="flag-box">
      <div class="chakra"></div>
    </div>
    <div class="title">FREE FIRE</div>
    <div class="sub-logo">⚡ FF IDENTITY</div>
  </div>

  <div class="content">
    <div class="avatar-container" onclick="document.getElementById('avatar-input').click()">
      <img src="https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555" alt="Primis Character">
      <div class="avatar-hint" data-html2pdf-ignore="true">📷 CHANGE</div>
      <input type="file" id="avatar-input" accept="image/*" onchange="loadAvatar(event)">
    </div>

    <div class="details">
      <div class="field-row">
        <div>
          <div class="label">PLAYER NAME:</div>
          <input type="text" class="input-box" value="Madara">
        </div>
        <div class="icon-badge">🏆</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">UID:</div>
          <input type="text" class="input-box" value="696369108" oninput="updateBarcode(this.value)">
        </div>
        <div class="icon-badge">🛡️</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">GUILD NAME:</div>
          <input type="text" class="input-box" value="Akatsuki">
        </div>
        <div class="icon-badge">☁️</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">REGION:</div>
          <input type="text" class="input-box" value="INDIA">
        </div>
        <div class="icon-badge">🇮🇳</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">LEVEL:</div>
          <input type="text" class="input-box" value="75">
        </div>
        <div class="icon-badge">⭐</div>
      </div>

      <div class="field-row">
        <div>
          <div class="label">ELITE PASS:</div>
          <input type="text" class="input-box" value="MAX">
        </div>
        <div class="icon-badge">👑</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">
      MY <span>FREE FIRE</span> IDENTITY
    </div>
    <div class="barcode-box">
      <div class="barcode">|||| ||| ||||| |||</div>
      <div class="barcode-id" id="barcode-text">FFID-696369108</div>
    </div>
  </div>

  <div class="btn-container" data-html2pdf-ignore="true">
    <button type="button" class="action-btn fetch-btn" onclick="fetchFromDatabase()">FETCH</button>
    <button type="button" class="action-btn save-btn" onclick="saveToDatabase()">SAVE</button>
    <button type="button" class="action-btn clear-btn" onclick="clearCardForm()">CLEAR</button>
  </div>

  <button type="button" class="action-btn pdf-btn" onclick="downloadCardPDF()" data-html2pdf-ignore="true">📥 DOWNLOAD PDF</button>

  <footer class="card-footer" data-html2pdf-ignore="true">
    <p>© Copyright by Zahid &amp; Created by Zahid</p>
  </footer>
</div>

<div class="modal-overlay" id="playerModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>👥 ALL PLAYERS LIST</h3>
      <button class="close-btn" onclick="closePlayerList()">✕</button>
    </div>
    
    <div class="modal-search-box">
      <input type="text" class="modal-search-input" id="modalSearchInput" placeholder="🔍 Search by Name or UID..." onkeyup="filterPlayerList()">
    </div>

    <div class="player-list" id="modal-player-list">
      <p style="text-align: center; color: #8a8d9b; font-family: 'Orbitron'; font-size: 13px;">Loading players...</p>
    </div>
  </div>
</div>

<script>
  let currentAvatarBase64 = ''; 
  let allPlayersData = []; 

  function loadAvatar(event) {
    const file = event.target.files[0];
    if (file) {
      if (file.size > 2 * 1024 * 1024) {
        alert("Kripya 2MB se kam size ki image select karein!");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        currentAvatarBase64 = e.target.result;
        document.querySelector('.avatar-container img').src = currentAvatarBase64;
      };
      reader.readAsDataURL(file);
    }
  }

  function updateBarcode(val) {
    document.getElementById('barcode-text').innerText = 'FFID-' + val;
  }

  function populateCard(player) {
    const inputs = document.querySelectorAll('.input-box');
    inputs[0].value = player.playerName || '';
    inputs[1].value = player.uid || '';
    inputs[2].value = player.guildName || '';
    inputs[3].value = player.region || '';
    inputs[4].value = player.level || '';
    inputs[5].value = player.elitePass || '';

    if (player.avatarUrl) {
      document.querySelector('.avatar-container img').src = player.avatarUrl;
      currentAvatarBase64 = player.avatarUrl;
    } else {
      document.querySelector('.avatar-container img').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
      currentAvatarBase64 = '';
    }

    updateBarcode(player.uid || '');
  }

  async function fetchFromDatabase() {
    const inputs = document.querySelectorAll('.input-box');
    const uidInput = inputs[1].value.trim();

    if (!uidInput) {
      alert('Kripya pehle UID field me ID enter karein!');
      return;
    }

    const API_URL = `https://ff-player-card.onrender.com/api/player/${uidInput}`;

    try {
      const response = await fetch(API_URL, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      
      const result = await response.json();

      if (result.success) {
        populateCard(result.data);
        alert('Player Data Successfully Load Ho Gaya!');
      } else {
        alert('Is UID ka koi data database me nahi mila!');
      }
    } catch (error) {
      console.error('FETCH ERROR:', error);
      alert('Backend se connect karne me error aaya!');
    }
  }

  async function saveToDatabase() {
    const inputs = document.querySelectorAll('.input-box');
    const defaultImgSrc = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';

    const playerData = {
      playerName: inputs[0].value,
      uid: inputs[1].value,
      guildName: inputs[2].value,
      region: inputs[3].value,
      level: Number(inputs[4].value),
      elitePass: inputs[5].value,
      avatarUrl: currentAvatarBase64 ? currentAvatarBase64 : defaultImgSrc
    };

    const API_URL = 'https://ff-player-card.onrender.com/api/player/save';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(playerData)
      });

      const result = await response.json();
      if (result.success) {
        alert('Data MongoDB Atlas me successfully save ho gaya!');
      } else {
        alert('Error: ' + (result.error || result.message));
      }
    } catch (error) {
      console.error('SAVE ERROR:', error);
      alert('Backend API se connection fail ho gaya!');
    }
  }
    
  async function downloadCardPDF() {
    const cardElement = document.getElementById('playerCardContainer');
    const playerName = document.querySelectorAll('.input-box')[0].value || 'Player';

    const wrapper = document.createElement('div');
    wrapper.style.width = '210mm';
    wrapper.style.height = '295mm';
    wrapper.style.display = 'flex';
    wrapper.style.justifyContent = 'center';
    wrapper.style.alignItems = 'center';
    wrapper.style.backgroundColor = '#ffffff';
    wrapper.style.boxSizing = 'border-box';
    wrapper.style.overflow = 'hidden';

    const clonedCard = cardElement.cloneNode(true);
    clonedCard.style.width = '530px'; 
    clonedCard.style.maxWidth = '100%';
    clonedCard.style.padding = '32px';
    clonedCard.style.margin = '0 auto';
    clonedCard.style.transform = 'scale(0.85)';
    clonedCard.style.transformOrigin = 'center center';
    clonedCard.style.position = 'relative';

    const watermarkText = document.createElement('div');
    watermarkText.innerText = 'AKATSUKI';
    watermarkText.style.position = 'absolute';
    watermarkText.style.top = '48%';
    watermarkText.style.left = '50%';
    watermarkText.style.transform = 'translate(-50%, -50%) rotate(-20deg)';
    watermarkText.style.fontSize = '72px';
    watermarkText.style.fontWeight = '900';
    watermarkText.style.color = '#ff0055';
    watermarkText.style.opacity = '0.06';
    watermarkText.style.letterSpacing = '6px';
    watermarkText.style.pointerEvents = 'none';
    watermarkText.style.zIndex = '0';
    watermarkText.style.whiteSpace = 'nowrap';
    clonedCard.appendChild(watermarkText);

    let footerBox = clonedCard.querySelector('.footer');
    if (!footerBox) {
      footerBox = document.createElement('div');
      footerBox.className = 'footer';
      clonedCard.appendChild(footerBox);
    }
    footerBox.style.marginTop = '24px';
    footerBox.style.paddingTop = '18px';
    footerBox.style.textAlign = 'center';
    footerBox.style.fontSize = '12px';
    footerBox.style.color = '#888888';
    footerBox.style.position = 'relative';
    footerBox.style.zIndex = '2';
    
    footerBox.innerHTML += '<div style="margin-top: 8px; font-weight: bold; color: #00f2fe; letter-spacing: 0.5px; font-family: Orbitron;">Created by Zahid</div>';

    const elementsToRemove = clonedCard.querySelectorAll('[data-html2pdf-ignore="true"]');
    elementsToRemove.forEach(el => el.remove());

    wrapper.appendChild(clonedCard);
    document.body.appendChild(wrapper);

    const options = {
      margin:       0,
      filename:     `FreeFire_Card_${playerName}.pdf`,
      image:        { type: 'jpeg', quality: 1.0 },
      html2canvas:  { scale: 3, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['avoid-all'] }
    };

    html2pdf().from(wrapper).set(options).save().then(() => {
      document.body.removeChild(wrapper);
    });
  }

  async function openPlayerList() {
    document.getElementById('playerModal').classList.add('active');
    document.getElementById('modalSearchInput').value = '';
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '<p style="text-align: center; color: #8a8d9b; font-family: \'Orbitron\'; font-size: 13px;">Loading players...</p>';

    const API_URL = `https://ff-player-card.onrender.com/api/players`;

    try {
      const response = await fetch(API_URL);
      
      if (!response.ok) {
        throw new Error(`Server Status: ${response.status}`);
      }
      
      const result = await response.json();

      if (result.success && result.data && result.data.length > 0) {
        allPlayersData = result.data;
        renderPlayerList(allPlayersData);
      } else {
        listContainer.innerHTML = '<p style="text-align: center; color: #8a8d9b; font-family: \'Orbitron\'; font-size: 13px;">Database me koi player nahi mila!</p>';
      }
    } catch (error) {
      console.error('FETCH PLAYERS ERROR:', error);
      listContainer.innerHTML = `<p style="text-align: center; color: #ff0055; font-family: \'Orbitron\'; font-size: 13px;">Failed to load player list!<br><small>(${error.message})</small></p>`;
    }
  }

  function renderPlayerList(players) {
    const listContainer = document.getElementById('modal-player-list');
    listContainer.innerHTML = '';

    if (players.length === 0) {
      listContainer.innerHTML = '<p style="text-align: center; color: #8a8d9b; font-family: \'Orbitron\'; font-size: 13px;">Koi matching player nahi mila!</p>';
      return;
    }

    players.forEach(player => {
      const item = document.createElement('div');
      item.className = 'player-item';
      
      item.innerHTML = `
        <div class="p-info" onclick="selectPlayer('${player.uid}')">
          <span class="p-name">${player.playerName || 'Unknown'}</span>
          <span class="p-uid">UID: ${player.uid}</span>
        </div>
        <button type="button" class="delete-btn" onclick="deletePlayer(event, '${player.uid}', '${player.playerName || 'Player'}')">🗑️ Delete</button>
      `;

      listContainer.appendChild(item);
    });
  }

  function selectPlayer(uid) {
    const player = allPlayersData.find(p => p.uid == uid);
    if (player) {
      populateCard(player);
      closePlayerList();
    }
  }

  async function deletePlayer(event, uid, name) {
    event.stopPropagation();

    const confirmDelete = confirm(`Kya aap sach me ${name} (UID: ${uid}) ko delete karna chahte hain?`);
    if (!confirmDelete) return;

    const API_URL = `https://ff-player-card.onrender.com/api/player/delete/${uid}`;

    try {
      const response = await fetch(API_URL, {
        method: 'DELETE',
        headers: { 'Accept': 'application/json' }
      });

      const result = await response.json();

      if (result.success) {
        alert(`${name} successfully delete ho gaya!`);
        allPlayersData = allPlayersData.filter(p => p.uid != uid);
        filterPlayerList();
      } else {
        alert('Delete nahi ho paya: ' + (result.message || result.error || 'Unknown error'));
      }
    } catch (error) {
      console.error('DELETE ERROR:', error);
      alert('Delete API se connect karne me error aaya!');
    }
  }

  function filterPlayerList() {
    const query = document.getElementById('modalSearchInput').value.toLowerCase().trim();
    
    const filtered = allPlayersData.filter(player => {
      const name = (player.playerName || '').toLowerCase();
      const uid = (player.uid || '').toString();
      return name.includes(query) || uid.includes(query);
    });

    renderPlayerList(filtered);
  }

  function closePlayerList() {
    document.getElementById('playerModal').classList.remove('active');
  }

  function clearCardForm() {
    const inputs = document.querySelectorAll('.input-box');
    inputs.forEach(input => input.value = '');
    currentAvatarBase64 = '';
    document.querySelector('.avatar-container img').src = 'https://static.wikia.nocookie.net/garena-freefire/images/7/73/Primis.jpg/revision/latest?cb=20210805064555';
    document.getElementById('barcode-text').innerText = 'FFID-';
  }
</script>
