<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Akatsuki Custom Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 20%, rgba(255,20,20,0.12), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(150,0,180,0.12), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== Hamburger Menu ===== */
        .menu-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 46px;
            height: 46px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid #ff1414;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(255, 20, 20, 0.5);
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .menu-btn:active {
            transform: scale(0.92);
        }

        .menu-btn span {
            display: block;
            width: 22px;
            height: 3px;
            background: #ff5050;
            border-radius: 3px;
            box-shadow: 0 0 6px rgba(255, 20, 20, 0.9);
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .menu-btn.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* ===== Player List Panel ===== */
        .player-panel {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(300px, 80vw);
            background: linear-gradient(160deg, #1c1030 0%, #16213e 100%);
            border-left: 3px solid #ff1414;
            box-shadow: -10px 0 40px rgba(255, 20, 20, 0.35);
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(.4,0,.2,1);
            padding: 90px 25px 25px;
            overflow-y: auto;
        }

        .player-panel.open {
            transform: translateX(0);
        }

        .player-panel h2 {
            color: #ff1414;
            font-size: 24px;
            text-shadow: 0 0 15px rgba(255, 20, 20, 0.8);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        .player-panel ul {
            list-style: none;
        }

        .player-panel li {
            background: rgba(255, 20, 20, 0.1);
            border-left: 3px solid #ff1414;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 10px;
            color: #e0e0e0;
            font-size: 15px;
            transition: background 0.2s ease;
        }

        .player-panel li:hover {
            background: rgba(255, 20, 20, 0.22);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== Main Container ===== */
        .container {
            background: linear-gradient(135deg, rgba(255, 20, 20, 0.1) 0%, rgba(100, 0, 100, 0.1) 100%);
            border: 3px solid #ff1414;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 50px rgba(255, 20, 20, 0.3), inset 0 0 30px rgba(255, 20, 20, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 44px;
            font-weight: bold;
            color: #ff1414;
            text-shadow: 0 0 20px rgba(255, 20, 20, 0.8);
            margin: 10px 0;
            animation: pulse 2s infinite;
            line-height: 1.3;
        }

        .cloud-emoji {
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(255, 20, 20, 0.9)) drop-shadow(0 0 25px rgba(255, 20, 20, 0.6));
        }

        .subtitle {
            font-size: 20px;
            color: #e0e0e0;
            margin-top: 15px;
        }

        .prizes-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 30px 20px;
            margin: 30px 0;
            border: 2px solid rgba(255, 20, 20, 0.5);
        }

        .prize-title {
            font-size: 24px;
            color: #ffeb3b;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .prize-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 20, 20, 0.1);
            border-radius: 8px;
            border-left: 4px solid #ff1414;
            transition: all 0.3s ease;
        }

        .prize-row:hover {
            background: rgba(255, 20, 20, 0.2);
            transform: translateX(10px);
        }

        .position {
            font-size: 28px;
            font-weight: bold;
            color: #ff1414;
            min-width: 60px;
        }

        .prize-amount {
            font-size: 26px;
            color: #ffeb3b;
            font-weight: bold;
        }

        .medal {
            font-size: 36px;
            margin: 0 10px;
        }

        .cta-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 20, 20, 0.15);
            border-radius: 10px;
            border: 2px dashed #ff1414;
        }

        .cta-text {
            font-size: 18px;
            color: #e0e0e0;
            margin: 10px 0;
        }

        .booyah {
            font-size: 34px;
            font-weight: bold;
            color: #ff1414;
            text-shadow: 0 0 15px rgba(255, 20, 20, 0.8);
            margin-top: 15px;
            animation: bounce 1s infinite;
        }

        .trophy {
            font-size: 56px;
            margin: 15px 0;
            animation: spin 3s infinite linear;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 20, 20, 0.8);
            }
            50% {
                opacity: 0.8;
                text-shadow: 0 0 40px rgba(255, 20, 20, 1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes spin {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        .footer {
            margin-top: 20px;
            font-size: 15px;
            color: #b0b0b0;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
                align-items: center;
            }
            .container {
                padding: 22px 18px;
            }
            .title {
                font-size: 30px;
            }
            .subtitle {
                font-size: 16px;
            }
            .prize-row {
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px;
            }
            .position {
                font-size: 22px;
                min-width: 50px;
            }
            .prize-amount {
                font-size: 20px;
            }
            .medal {
                font-size: 30px;
            }
            .trophy {
                font-size: 46px;
            }
            .booyah {
                font-size: 26px;
            }
            .menu-btn {
                top: 12px;
                right: 12px;
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>
<body>

    <!-- Hamburger Menu Button -->
    <div class="menu-btn" id="menuBtn" onclick="togglePanel()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Player List Side Panel -->
    <div class="player-panel" id="playerPanel">
        <h2>👥 Player List</h2>
        <ul>
            <li>Player 1</li>
            <li>Player 2</li>
            <li>Player 3</li>
            <li>Player 4</li>
        </ul>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="togglePanel()"></div>

    <div class="container">
        <div class="header">
            <div class="title"><span class="cloud-emoji">☁️</span> AKATSUKI CUSTOM</div>
            <div class="subtitle">💌 CHALLENGE 💌</div>
        </div>

        <div class="prizes-section">
            <div class="prize-title">🎯 PRIZE POOL</div>

            <div class="prize-row">
                <span class="medal">🥇</span>
                <span class="position">TOP 1</span>
                <span class="prize-amount">20 RS</span>
            </div>

            <div class="prize-row">
                <span class="medal">🥈</span>
                <span class="position">TOP 2</span>
                <span class="prize-amount">15 RS</span>
            </div>

            <div class="prize-row">
                <span class="medal">🥉</span>
                <span class="position">TOP 3</span>
                <span class="prize-amount">10 RS</span>
            </div>
        </div>

        <div class="cta-section">
            <div class="trophy">🏆</div>
            <div class="cta-text">Custom Booyah Winner!</div>
            <div class="booyah">BOOYAH! 🎮</div>
            <div class="cta-text" style="margin-top: 15px; font-weight: bold; font-size: 20px;">
                Are You Ready to DOMINATE?
            </div>
        </div>

        <div class="footer">
            Show your skills • Claim your prize • Become a legend
        </div>
    </div>

    <script>
        function togglePanel() {
            document.getElementById('menuBtn').classList.toggle('active');
            document.getElementById('playerPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
    </script>
</body>
</html>
